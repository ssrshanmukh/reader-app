toast(n?`Imported ${n} project${n>1?'s':''}${bad?` · ${bad} file${bad>1?'s':''} skipped`:''}`:same?'Already up to date':bad?'Not a valid Reader project zip':'Nothing to import');
if(open&&p&&(n===1&&!same||(!n&&same===1)))openP(p.id);return n}
/* folder storage */
const kset=async(k,v)=>{if(!db)return;try{const tx=db.transaction('k','readwrite');tx.objectStore('k').put(v,k);await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=tx.onabort=()=>no(tx.error)})}catch{}};
const canDir=()=>typeof window.showDirectoryPicker==='function'&&!!window.isSecureContext;
const inFrame=()=>{try{return window.top!==window.self}catch{return true}};
const dirWhy=()=>{const ua=navigator.userAgent||'';if(/Android|iPhone|iPad|iPod/i.test(ua))return'The phone browser you’re using doesn’t allow web apps to save into a folder you choose (Android Chrome and iPhone). Your projects are kept inside the app; use ⋮ → “Export all as zip” to keep copies in your own storage, and “Add project zip files” to bring them back.';
if(!window.isSecureContext)return'Folder access only works on a secure page. Open the app from its https:// link (or http://localhost), not from a local file or plain http.';
if(navigator.brave)return'Brave turns off folder access by default. In Brave open brave://flags/#file-system-access-api, set it to Enabled, restart Brave and open the app again. Or use Chrome or Edge.';
if(/Firefox/i.test(ua))return'Firefox can’t save into a folder you choose. Open the app in Chrome or Edge on your laptop.';
if(/Safari/i.test(ua)&&!/Chrome|Chromium|Edg/i.test(ua))return'Safari can’t save into a folder you choose. Open the app in Chrome or Edge on your laptop.';
if(inFrame())return'Folder access is blocked inside a preview frame. Open the app link in its own browser tab in Chrome or Edge.';
return'This browser doesn’t support choosing a storage folder. Open the app in the latest Chrome or Edge on your laptop. Meanwhile ⋮ → “Export all as zip” keeps copies in your own storage.'};
const frameNote=()=>inFrame()?' You’re viewing this inside a preview frame: if the picker doesn’t open, open the app link in its own browser tab.':'';
const pickErr=e=>{if(e&&e.name==='SecurityError')toast('Folder picker is blocked here. Open the app link in its own browser tab (Chrome or Edge) and try again.');else if(e&&e.name!=='AbortError')toast('That folder can’t be used — create a new folder and pick it')};
const hasPerm=async()=>{try{return(await dirH.queryPermission({mode:'readwrite'}))==='granted'}catch{return false}};
const setFix=v=>{$('#fix').hidden=!v;if(v)lab.textContent='Folder access needed'};
async function diskFlush(){if(!dirH||dw)return;dw=true;let bad=false,cur=null;
try{if(!await hasPerm()){bad=true;setFix(true);return}
while(dirtyP.size||goneF.size){for(const id of[...dirtyP]){cur=id;dirtyP.delete(id);const p=projs.find(x=>x.id===id);if(!p)continue;const nm=fname(p),blob=await projectZip(p),w=await(await dirH.getFileHandle(nm,{create:true})).createWritable();try{await w.write(blob);await w.close()}catch(e){try{await w.abort()}catch{}throw e}
if(p.file&&p.file!==nm)goneF.add(p.file);p.file=nm;cur=null}
for(const f of[...goneF]){goneF.delete(f);try{await dirH.removeEntry(f)}catch{}}}
lab.textContent='Saved to '+dirH.name;setFix(false)}
catch(e){bad=true;if(cur)dirtyP.add(cur);console.warn(e);lab.textContent='Could not write to folder';setFix(true)}
finally{dw=false;if(!bad&&(dirtyP.size||goneF.size))setTimeout(diskFlush,200)}}
$('#fix').onclick=async()=>{try{if(await dirH.requestPermission({mode:'readwrite'})==='granted'){projs.forEach(p=>dirtyP.add(p.id));setFix(false);diskFlush()}else toast('Permission not granted')}catch{toast('Could not reconnect — choose the folder again');runSetup(false)}};
async function restoreFromFolder(){let fs=[];try{for await(const[n,h]of dirH.entries())if(h.kind==='file'&&/\.zip$/i.test(n)){const f=await h.getFile();Object.defineProperty(f,'__n',{value:n});fs.push(f)}}catch{return 0}
let n=0;for(const f of fs){try{const r=await importBuf(await f.arrayBuffer(),f.__n,true);n+=r.n||0}catch(e){console.warn('skip',f.__n,e)}}return n}
function runSetup(must){return new Promise(ok=>{const d=$('#sd');let done=false,busy=false;
$('#sdt').textContent=must?'Where should your projects be stored?':'Storage folder';
$('#sdp').textContent=canDir()?'Tap the button below. Your device’s folder picker opens; choose (or create) a folder and confirm. Every change is then saved there automatically as one .zip per project. Nothing goes to the cloud.'+frameNote():dirWhy();
$('#spath').textContent=dirH?'Current: '+dirH.name:'No folder chosen';$('#sch').hidden=!canDir();$('#sset').hidden=true;$('#sskip').hidden=canDir()||!must;$('#scx').hidden=must;
const fin=v=>{if(done)return;done=true;d.close();ok(v)};
$('#sch').onclick=async()=>{if(busy)return;let h;try{h=await showDirectoryPicker({id:'sbs-reader',mode:'readwrite'})}catch(e){pickErr(e);return}
busy=true;try{try{if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('Permission needed to save in this folder');return}}catch{}
$('#spath').textContent='Storage folder: '+h.name;
dirH=h;mode='folder';await kset('dir',h);await kset('setup','folder');setFix(false);lab.textContent='Reading folder…';const n=await restoreFromFolder();projs.forEach(p=>dirtyP.add(p.id));projs.sort((a,b)=>(b.u||0)-(a.u||0));save(1);fl();toast(`Storage set to “${h.name}”`+(n?` · found ${n} project${n>1?'s':''}`:''));fin(true)}finally{busy=false}};
$('#sskip').onclick=async()=>{mode='manual';await kset('setup','manual');fl();lab.textContent='Saved on this device';fin(false)};
$('#scx').onclick=()=>fin(false);d.oncancel=e=>{e.preventDefault();if(!must)fin(false)};d.showModal()})}
/* change path: pick a new folder, move every project zip there, remove them from the old folder */
async function changePath(){
let h;try{h=await showDirectoryPicker({id:'sbs-reader',mode:'readwrite',...(dirH?{startIn:dirH}:{})})}catch(e){pickErr(e);return}
const old=dirH;
try{if(old&&await h.isSameEntry(old))return toast('That is already your storage folder')}catch{}
try{if(await h.requestPermission({mode:'readwrite'})!=='granted')return toast('Permission needed to save in this folder')}catch{}
if(!await cf(old?'Move all projects?':'Use this folder?',old?`Your project zips will be copied to “${h.name}” and then removed from “${old.name}”.`:`Your projects will be saved in “${h.name}”.`,old?'Move':'Use folder'))return;
while(dw)await new Promise(r=>setTimeout(r,100));dw=true;
const oldFiles=new Set([...goneF,...projs.map(p=>p.file).filter(Boolean)]),oldMap=new Map(projs.map(p=>[p.id,p.file])),names=new Map;
lab.textContent='Moving projects…';
try{dirH=h;await restoreFromFolder();
for(const p of projs){const nm=fname(p),blob=await projectZip(p),fh=await h.getFileHandle(nm,{create:true}),w=await fh.createWritable();
try{await w.write(blob);await w.close()}catch(e){try{await w.abort()}catch{}throw e}
if((await fh.getFile()).size!==blob.size)throw new Error('Could not verify '+p.name);names.set(p.id,nm)}}
catch(e){console.warn(e);dirH=old;for(const p of projs){if(oldMap.has(p.id)){const f=oldMap.get(p.id);f?p.file=f:delete p.file}else{delete p.file;dirtyP.add(p.id)}}
dw=false;lab.textContent=old?'Saved to '+old.name:'Saved on this device';toast('Move failed — your files are still in the old folder');if(dirtyP.size||goneF.size)diskFlush();return}
for(const p of projs)p.file=names.get(p.id);
await kset('dir',h);await kset('setup','folder');mode='folder';
let left=0;if(old){let ok=false;try{ok=(await old.queryPermission({mode:'readwrite'}))==='granted'||(await old.requestPermission({mode:'readwrite'}))==='granted'}catch{}
for(const f of oldFiles){if(!ok){left++;continue}try{await old.removeEntry(f)}catch(e){if(e.name!=='NotFoundError')left++}}}
goneF.clear();dw=false;setFix(false);save(1);fl();if(view==='home')renderHome();lab.textContent='Saved to '+h.name;
toast(`Moved ${names.size} project${names.size===1?'':'s'} to “${h.name}”`+(left?` · ${left} old file${left>1?'s':''} couldn’t be removed from the old folder`:''));
if(dirtyP.size)diskFlush()}
const fl=()=>{$('#fl').textContent=dirH?'Your projects are saved as zip files in: '+dirH.name:'Projects are stored inside this app. Use ⋮ → “Export all as zip” for a copy in your own storage.'};
async function exportAll(){if(!projs.length)return toast('No projects yet');lab.textContent='Building zip…';try{const fs=[];for(const p of projs)fs.push({name:fname(p),blob:await projectZip(p)});dl(await makeZip(fs),'reader-projects-'+new Date().toISOString().slice(0,10)+'.zip');toast('Zip downloaded')}catch(e){toast('Export failed: '+e.message)}lab.textContent=dirH?'Saved to folder':'Saved on this device'}
async function shareZip(p){const blob=await projectZip(p),f=new File([blob],fname(p),{type:'application/zip'}),d={title:p.name,files:[f]};if(/^https?:/.test(location.protocol))d.text='Open this project in Side-by-side Reader: '+location.href.split(/[?#]/)[0];
try{if(navigator.canShare?.({files:[f]})){await navigator.share(d);return}throw 0}catch(e){if(e&&e.name==='AbortError')return;dl(blob,f.name);toast('Sharing unavailable here — zip downloaded')}}
$('#zp').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importFiles(fs,true,false)};
/* choose zip file(s) from anywhere on the device, then open the project */
async function importPick(){if(typeof window.showOpenFilePicker==='function'&&window.isSecureContext){try{const hs=await showOpenFilePicker({multiple:true,id:'sbs-import',types:[{description:'Reader project (zip)',accept:{'application/zip':['.zip']}}]});const fs=await Promise.all(hs.map(h=>h.getFile()));if(fs.length)importFiles(fs,true,false);return}catch(e){if(e&&e.name==='AbortError')return}}$('#zp').click()}
const homeMenu=()=>[['Import project (zip)…',importPick],...(dirH?[['Reload from storage folder',async()=>{lab.textContent='Reading folder…';const n=await restoreFromFolder();if(n){save(1);renderHome()}toast(n?`Loaded ${n} project${n>1?'s':''}`:'Nothing new in the folder');lab.textContent='Saved to '+dirH.name}]]:[]),(canDir()?[dirH?'Change storage path…':'Set storage path…',changePath]:['Storage info…',()=>runSetup(false)]),['Export all as zip',exportAll],...(ip?[['Install app',inst]]:[]),...(/^https?:/.test(location.protocol)&&navigator.share?[['Share app link',()=>navigator.share({title:document.title,url:location.href.split(/[?#]/)[0]}).catch(()=>{})]]:[])];
$('#hm').onclick=e=>menu(e.currentTarget,homeMenu());
/* boot */
(async()=>{let setup=null;try{db=await new Promise((ok,no)=>{const r=indexedDB.open('sbs4',1);r.onupgradeneeded=()=>{r.result.createObjectStore('k');r.result.createObjectStore('items',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=db.transaction(['k','items']),[PL,L,all,sd,dh]=await Promise.all([rq(tx.objectStore('k').get('projects')),rq(tx.objectStore('k').get('layout')),rq(tx.objectStore('items').getAll()),rq(tx.objectStore('k').get('setup')),rq(tx.objectStore('k').get('dir'))]);
all.forEach(i=>items.set(i.id,i));setup=sd||null;if(dh&&dh.kind==='directory')dirH=dh;
if(PL){projs=PL.list||[];st=projs.find(p=>p.id===PL.cur)||null}else if(L){projs=[{id:uid(),name:'My project',cols:L.cols,x:L.x||0,sc:L.sc||{},u:Date.now()}];st=projs[0]}}catch{db=null}
ready=true;
if(dirH&&setup==='folder'){fl();if(!await hasPerm())setFix(true);else lab.textContent='Saved to '+dirH.name}else lab.textContent=db?'Saved on this device':'Saved in this session';
const sp=new URLSearchParams(location.search),inbox=sp.get('inbox')==='1';
if(!setup)await runSetup(true);
fl();
if(st)openP(st.id);else goHome();
if(dirH&&dirtyP.size===0&&projs.length&&await hasPerm()){projs.forEach(p=>{if(!p.file)dirtyP.add(p.id)});diskFlush()}
if(inbox){history.replaceState(null,'',location.pathname);try{const c=await caches.open('sbs-inbox'),ks=await c.keys(),fs=[];for(const k of ks){const r=await c.match(k);fs.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'shared.zip'),{type:'application/zip'}));await c.delete(k)}if(fs.length)await importFiles(fs,true,false)}catch(e){console.warn(e)}}
if('launchQueue'in window)launchQueue.setConsumer(async lp=>{if(!lp.files||!lp.files.length)return;const fs=[];for(const h of lp.files)fs.push(await h.getFile());importFiles(fs,true,false)});
document.fonts?.ready.then(restore);addEventListener('load',restore);navigator.storage?.persist?.()})();
})();
