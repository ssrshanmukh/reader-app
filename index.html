<style>

</style></head><body>
<main class="app">
<div class="top"><div class="pt"><button class="b" id="home" title="All projects" aria-label="All projects">‹</button><h1 id="pn">Side-by-side Reader</h1><button class="b" id="menu" title="Project menu" aria-label="Project menu">⋮</button></div><span style="display:flex;align-items:center;gap:8px"><button class="b" id="fix" hidden>📁 Reconnect folder</button><small id="state">Loading…</small></span></div>

<script>
(()=>{'use strict';

const root=$('#cols'),lab=$('#state'),col=id=>st.cols.find(c=>c.id===id);

const url=id=>{let u=urls.get(id);if(!u){u=URL.createObjectURL(items.get(id).blob);urls.set(id,u)}return u};

function redo(){if(!fut.length)return;past.push(JSON.stringify(st.cols));st.cols=JSON.parse(fut.pop());render();save()}
/* scroll memory */
function capture(){if(!ready||view!=='proj'||!st||!root.children.length)return;st.x=root.scrollLeft;for(const c of root.children){const sc=c.querySelector('.sc');for(const e of sc.firstChild.children){if(e.offsetTop+e.offsetHeight>sc.scrollTop+1){st.sc[c.dataset.id]={id:e.dataset.id,f:(sc.scrollTop-e.offsetTop)/(e.offsetHeight||1)};break}}}}

root.addEventListener('scroll',()=>{if(!ready||Date.now()<mute)return;clearTimeout(sT);sT=setTimeout(()=>{capture();save(1)},200)},true);
addEventListener('resize',()=>{mute=Date.now()+500;requestAnimationFrame(restore)});
const leave=()=>{capture();flush()};addEventListener('pagehide',leave);document.addEventListener('visibilitychange',()=>{if(document.hidden)leave()});
/* render */
const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
function onIO(es){for(const e of es){const im=e.target.firstChild;if(e.isIntersecting){if(!im.src)im.src=url(e.target.dataset.id)}else im.removeAttribute('src')}}
function itEl(c,id){const it=items.get(id);if(!it)return null;const e=document.createElement('div');e.className='it';e.dataset.id=id;e.draggable=true;
if(it.type==='text'){e.classList.add('tx');const t=document.createElement('textarea');t.rows=1;t.placeholder='Write something…';t.value=it.text||'';t.draggable=false;t.oninput=()=>{it.text=t.value;dirty.add(id);fit(t);save()};e.append(t)}

function colEl(c){const e=document.createElement('section');e.className='col'+(c.mode==='orig'?' orig':'');e.dataset.id=c.id;
e.innerHTML='<header><input class="t" maxlength="40" aria-label="Column name"><button class="i" data-a="mode" title="Toggle fit width / original size">⤢</button><button class="i" data-a="img" title="Add images (originals)">＋</button><button class="i" data-a="txt" title="Add text">T</button><button class="i d" data-a="delcol" title="Delete column">🗑</button></header><div class="sc"><div class="list" role="list"></div></div>';
const t=e.querySelector('.t');t.value=c.title;t.onchange=()=>{c.title=t.value.trim()||'Untitled';t.value=c.title;save()};t.onkeydown=k=>{if(k.key==='Enter')t.blur()};

function render(keep=true){if(keep)capture();if(!st)return;io?.disconnect();io=new IntersectionObserver(onIO,{rootMargin:'150% 0px'});root.style.setProperty('--n',st.cols.length);root.replaceChildren(...st.cols.map(colEl));root.querySelectorAll('textarea').forEach(fit);restore()}
/* adding */
const dims=f=>new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{r([i.naturalWidth||4,i.naturalHeight||3]);URL.revokeObjectURL(u)};i.onerror=()=>{r([4,3]);URL.revokeObjectURL(u)};i.src=u});
async function addFiles(cid,files,at){files=[...files].filter(f=>f.type.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp|svg|avif|heic|heif)$/i.test(f.name));if(!files.length)return toast('Choose image files');const out=[];let n=0;

commit(()=>{const c=col(cid);if(c)c.ids.splice(at??c.ids.length,0,...out)})}
function move(id,cid,at){const to=col(cid);let from=st.cols.find(c=>c.ids.includes(id));if(!from||!to)return;const i=from.ids.indexOf(id);if(from===to&&(at===i||at===i+1))return;commit(()=>{from.ids.splice(i,1);if(from===to&&i<at)at--;to.ids.splice(at,0,id)})}
/* events */

else if(a==='txt'){const it={id:uid(),type:'text',text:''};items.set(it.id,it);dirty.add(it.id);commit(()=>c.ids.push(it.id));const sc=cEl.isConnected?root.querySelector(`[data-id="${c.id}"] .sc`):null;const ta=root.querySelector(`[data-id="${c.id}"] .it:last-child textarea`);if(ta){ta.focus();if(sc)sc.scrollTop=sc.scrollHeight}}

function vShow(i){vi=i;const it=items.get(vl[i]);if(vu)URL.revokeObjectURL(vu);vu=URL.createObjectURL(it.blob);VM.src=vu;$('#vn').textContent=it.name||'Image';sc=1;tx=ty=0;vT();$('#vp').disabled=i<1;$('#vq').disabled=i>=vl.length-1}
function openV(l,id){vl=l;V.hidden=false;vShow(Math.max(0,l.indexOf(id)))}
function closeV(){V.hidden=true;VM.removeAttribute('src');if(vu)URL.revokeObjectURL(vu);vu=null}
const vGo=d=>{if(vl[vi+d])vShow(vi+d)},zb=k=>{sc=Math.max(1,Math.min(10,sc*k));if(sc===1)tx=ty=0;vT()},dist=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
$('#vc').onclick=closeV;$('#vp').onclick=()=>vGo(-1);$('#vq').onclick=()=>vGo(1);$('#vi').onclick=()=>zb(1.3);$('#vo').onclick=()=>zb(1/1.3);
